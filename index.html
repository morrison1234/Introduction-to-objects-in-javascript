<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My phone contact</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="py-5">
    <div class="container">
        <h1 class="nb-1">My phone contact</h1>
        <p class="text-muted mb-4">
            Introduction to javascript objects
        </p>
        <div class="card shadow -sm mb-3" style="max-width: 400px;">
            <div class="card-body">
                <h5 class="card-title" style="font-size:1.5rem;color orange:">contact list</h5>
                <ul class="list group-item">
                    <li class="list-group-item">
                        <span class="card-label d-block">Name</span>
                        <strong id="Name"></strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">Phone</span>
                        <strong id="Phone"></strong>
                    </li>
                    <li class="list-group-item">
                        <span class="card-label d-block">Email</span>
                        <strong id="Email"></strong>
                    </li>
                </ul>
            </div>
        </div>
    </div>
    <script>
        const contact={
            Name:"John Doe",
            Phone:"+1 234 567 676",
            Email:"johndoe@example.com"

        }
        document.getElementById("Name").textContent=contact.Name;
        document.getElementById("Phone").textContent=contact.Phone;
        document.getElementById("Email").textContent=contact.Email;
    </script>
</body>
</html>
